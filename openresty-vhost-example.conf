server {
    listen 80;
    server_name music.archfox.eu.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name music.archfox.eu.cc;

    access_log /www/sites/music.archfox.eu.cc/log/access.log main;
    error_log /www/sites/music.archfox.eu.cc/log/error.log;

    ssl_certificate /www/sites/music.archfox.eu.cc/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/music.archfox.eu.cc/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /gmdl-dark.css {
        root /usr/share/nginx/html;
        default_type text/css;
        expires 1h;
    }

    location = /gmdl-ui.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        expires 1h;
    }

    location = /gmdl-feat.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        expires 1h;
    }

    location = /player {
        return 301 /player/;
    }

    location /player/ {
        proxy_pass http://127.0.0.1:4533/player/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:9981;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect http://127.0.0.1:9981/ /;
        # dynamic app: never cache HTML/API, versioned ?v= assets below keep 1h
        expires -1;
        # dark theme injection (disable upstream gzip so sub_filter can match)
        proxy_set_header Accept-Encoding "";
        sub_filter "</head>" "<link rel=\"stylesheet\" href=\"/gmdl-dark.css?v=12\"><script>(function(){try{var u=JSON.parse(localStorage.getItem('gmdl-ui')||'null');var t=u&&u.theme;if(!t||t==='auto'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}if(t==='dark'){document.documentElement.classList.add('dark');}}catch(e){try{document.documentElement.classList.add('dark');}catch(_){}}})();</script><script src=\"/gmdl-ui.js?v=9\" defer></script><script src=\"/gmdl-feat.js?v=2\" defer></script></head>";
        sub_filter_once on;
    }
}
